<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coffee Examined · Phone Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e3e5e1;color:#292b29;font:14px/1.5 system-ui,sans-serif;padding:20px 12px 32px}header{max-width:560px;margin:0 auto 18px;text-align:center}h1{font-size:20px;margin:0 0 5px}p{margin:0 0 12px;color:#666966}.sizes{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{min-height:40px;padding:8px 12px;border:1px solid #cba99a;background:white;border-radius:20px;color:#292b29;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#414a42;color:white}.stage{display:flex;justify-content:center;overflow-x:auto;padding:7px 6px 16px}.phone{width:414px;flex-shrink:0;background:#20291f;border:12px solid #20291f;border-radius:38px;box-shadow:0 12px 35px #20291f25;overflow:hidden}iframe{display:block;width:390px;height:844px;border:0;background:#f1f2ee;border-radius:25px}footer{text-align:center;font-size:12px;color:#666966;max-width:500px;margin:12px auto}a{color:#a52d20}button:focus-visible{outline:3px solid #466e93;outline-offset:3px}@media(max-width:440px){body{padding-left:0;padding-right:0}.stage{justify-content:flex-start}}
</style>
</head>
<body>
<header><h1>Coffee Examined · Phone preview</h1><p>The live app inside a phone-width viewport. Scroll and use it normally.</p><div class="sizes" role="group" aria-label="Phone viewport width"><button data-width="375" aria-pressed="false">375 px</button><button data-width="390" aria-pressed="true">390 px</button><button data-width="430" aria-pressed="false">430 px</button></div></header>
<div class="stage"><div class="phone" id="phone"><iframe id="app" src="index.html" title="Coffee Examined mobile app preview"></iframe></div></div>
<footer>Layout preview, without device or touch emulation. Changes to the app appear when you refresh this preview. <a href="index.html">Open full-size app</a></footer>
<script>
const frame=document.getElementById('app'),phone=document.getElementById('phone');
for(const button of document.querySelectorAll('[data-width]'))button.addEventListener('click',()=>{
const width=Number(button.dataset.width);frame.style.width=width+'px';phone.style.width=(width+24)+'px';
for(const other of document.querySelectorAll('[data-width]'))other.setAttribute('aria-pressed',String(other===button));
});
</script>
</body></html>
