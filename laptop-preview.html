<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coffee Examined · Laptop Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#e3e5e1;color:#292b29;font:14px/1.5 Arial,Helvetica,sans-serif;padding:18px 12px 30px}header{text-align:center;margin:0 auto 18px}h1{font-size:20px;margin:0 0 5px}p{margin:0 0 12px;color:#666966}.sizes{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{min-height:42px;padding:8px 13px;border:1px solid #9ca697;background:#f4f5f1;border-radius:8px;color:#292b29;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#414a42;color:#fff}.stage{display:flex;justify-content:center;padding:6px 0 20px;overflow:hidden}.scaled{position:relative;flex:none}.laptop{position:absolute;top:0;left:0;transform-origin:top left;background:#232724;border:12px solid #232724;border-top-width:22px;border-radius:16px 16px 8px 8px;box-shadow:0 15px 35px #0002}.laptop::before{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#697369;top:-14px;left:calc(50% - 3px)}.laptop::after{content:"";position:absolute;left:-34px;right:-34px;height:16px;bottom:-24px;background:linear-gradient(#c7ccc5,#929b90);border-radius:2px 2px 18px 18px;box-shadow:0 3px 4px #0002}iframe{display:block;width:1366px;height:768px;border:0;background:#eee; border-radius:5px}footer{text-align:center;color:#666966;font-size:12px}a{color:#414a42}button:focus-visible{outline:3px solid #667a69;outline-offset:3px}
</style></head><body><header><h1>Coffee Examined · Laptop preview</h1><p id="dimensions">1366 × 768 viewport · scaled to fit this pane</p><div class="sizes" role="group" aria-label="Laptop viewport size"><button data-width="1280" data-height="800" aria-pressed="false">1280 × 800</button><button data-width="1366" data-height="768" aria-pressed="true">1366 × 768</button><button data-width="1440" data-height="900" aria-pressed="false">1440 × 900</button></div></header><div class="stage" id="stage"><div class="scaled" id="scaled"><div class="laptop" id="laptop"><iframe id="app" src="index.html" title="Coffee Examined laptop preview"></iframe></div></div></div><footer>The live app at laptop width. Scroll inside the screen. <a href="index.html">Open full-size app</a></footer><script>
let width=1366,height=768;const frame=document.getElementById('app'),laptop=document.getElementById('laptop'),scaled=document.getElementById('scaled'),stage=document.getElementById('stage');
function fit(){const scale=Math.min(1,Math.max(1,stage.clientWidth-64)/(width+24));frame.style.width=width+'px';frame.style.height=height+'px';laptop.style.transform='scale('+scale+')';scaled.style.width=(width+24)*scale+'px';scaled.style.height=(height+60)*scale+'px';document.getElementById('dimensions').textContent=width+' × '+height+' viewport · '+Math.round(scale*100)+'% display scale';}
for(const button of document.querySelectorAll('[data-width]'))button.addEventListener('click',()=>{width=Number(button.dataset.width);height=Number(button.dataset.height);for(const other of document.querySelectorAll('[data-width]'))other.setAttribute('aria-pressed',String(other===button));fit()});window.addEventListener('resize',fit);fit();
</script></body></html>
